plugins {
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.gradle.userdev' version '7.0.145'
    id 'java-library'
    id 'com.github.johnrengelman.shadow' version '7.0.0'
}
base {
    archivesName = "${mod_name}-neoforge-${minecraft_version}"
}

jarJar.enable()
java.withSourcesJar()
apply from: 'https://gist.githubusercontent.com/Technici4n/facbcdf18ce1a556b76e6027180c32ce/raw/059ab3d504a590461746fc6e3065159f4932a960/classremapper.gradle'

if (file('src/main/resources/META-INF/accesstransformer.cfg').exists()) {
    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')
}
runs {
    configureEach {
        modSource project.sourceSets.main
    }
    client {
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
    }
    server {
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        programArgument '--nogui'
    }

    gameTestServer {
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
    }

    data {
        programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
    }
}

sourceSets.main.resources.srcDir 'src/generated/resources'

dependencies {
    implementation("net.neoforged:neoforge:${neo_version}")
    compileOnly project(":Common")
    implementation ("me.shedaniel.cloth:cloth-config-neoforge:${project.cloth_version}")
    implementation('org.ini4j:ini4j:0.5.4')
    shadow(implementation('org.ini4j:ini4j:0.5.4'))
//    jarJar('org.ini4j:ini4j version: [0.5.0,0.6.0)') {
//        version {
//            prefer "0.5.4"
//        }
//    }
}
tasks.named('jar', Jar) {
    // If you want the main JAR to be the shaded one for distribution
     from shadowJar.archiveFile
     dependsOn shadowJar
}


Spec<Task> notNeoTask = { Task it -> !it.name.startsWith("neo") } as Spec<Task>

tasks.withType(JavaCompile).matching(notNeoTask).configureEach {
    source(project(":Common").sourceSets.main.allSource)
}
tasks.withType(Javadoc).matching(notNeoTask).configureEach {
    source(project(":Common").sourceSets.main.allJava)
}
tasks.named("sourcesJar", Jar) {
    from(project(":Common").sourceSets.main.allSource)
}
tasks.withType(ProcessResources).matching(notNeoTask).configureEach {
    from project(":Common").sourceSets.main.resources
}
shadowJar {
    configurations = [project.configurations.shadow]
    archiveClassifier.set("")
}

jar {
    archiveClassifier = 'slim'
//    finalizedBy 'remapJar'
}
tasks.named('jarJar') {
    archiveClassifier = ''
}

