modLoader = "javafml" #mandatory
loaderVersion = "${forge_loader_version_range}" #mandatory This is typically bumped every Minecraft version by Forge. See our download page for lists of versions.
license = "${license}"
#issueTrackerURL="https://change.me.to.your.issue.tracker.example.invalid/" #optional
[[mods]] #mandatory
modId = "${mod_id}" #mandatory
version = "${version}" #mandatory
displayName = "${mod_name}" #mandatory
#updateJSONURL="https://change.me.example.invalid/updates.json" #optional
#displayURL="https://change.me.to.your.mods.homepage.example.invalid/" #optional
logoFile = "icon.png" #optional
credits = "${credits}" #optional
authors = "${mod_author}" #optional
description = '''${description}''' #mandatory (Supports multiline text)
# A dependency - use the . to indicate dependency for a specific modid. Dependencies are optional.
[[dependencies.haybale]] #optional
    modId = "forge" #mandatory
    mandatory = true #mandatory
    versionRange = "[47.3,)" #mandatory
    ordering = "NONE"
    side = "BOTH"
[[dependencies.haybale]]
    modId = "minecraft"
    mandatory = true
    versionRange = "[1.20.1]"
    ordering = "NONE"
    side = "BOTH"
[[dependencies.haybale]]
    modId = "cloth_config"
    mandatory = false
    versionRange = "[11,)"
    ordering="NONE"
    side="BOTH"
    [dependencies.haybale.mc-publish]
        ignore=false
        modrinth="9s6osm5g"
        curseforge="348521"